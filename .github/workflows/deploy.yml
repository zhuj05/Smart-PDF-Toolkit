name: Deploy Flet App to GitHub Pages

on:
  push:
    branches:
      - main  # 若預設分支是 master，請改為 master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Build Flet Web App
        run: |
          # --base-url 必須符合 GitHub Pages 的子路徑格式：/<repo名稱>/
          # 這裡使用動態變數取得當前 repo 名稱
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          flet publish main.py --base-url "/${REPO_NAME}/"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist  # flet publish 預設輸出的靜態檔案目錄

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
